# База данных для локальной разработки: docker compose up -d
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: literacy
      POSTGRES_PASSWORD: literacy
      POSTGRES_DB: literacy
    ports:
      - "5432:5432"
    volumes:
      - literacy_pgdata:/var/lib/postgresql/data

volumes:
  literacy_pgdata:
